<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Олеся Стриха, психолог</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: #d3dccb;
    color: #1e2a26;
    font: 1.0625rem/1.6 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  main { max-width: 30rem; }
  .code { margin: 0; font: italic 400 1.125rem/1 Georgia, "Times New Roman", serif; letter-spacing: 0.14em; color: #7a3042; }
  h1 { margin: 0.75rem 0 1rem; font: 400 clamp(2rem, 6vw, 2.75rem)/1.1 Georgia, "Times New Roman", serif; color: #1b4a3e; }
  p { margin: 0; color: #414d48; }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 3.25rem; margin-top: 2rem; padding: 0.75rem 1.75rem;
    border-radius: 999px; background: #7a3042; color: #fcf9f4; font-weight: 500; text-decoration: none;
  }
  a.btn:hover { background: #652636; }
  a.btn:focus-visible { outline: 2px solid #1b4a3e; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Вся информация — на главной странице.</p>
  <a class="btn" href="/">На главную</a>
</main>
</body>
</html>
